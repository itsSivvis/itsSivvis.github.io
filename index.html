<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="Die digitale Visitenkarte von itsSivvis. Ein guter Anfang ist ein Hallo.">
  <meta property="og:title" content="itsSivvis — Visitenkarte">
  <meta property="og:description" content="Ein guter Anfang ist ein Hallo.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://itssivvis.github.io/">
  <title>itsSivvis — Visitenkarte</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6f5f1'/%3E%3Ctext x='7' y='25' font-family='Georgia,serif' font-size='29' fill='%23252925'%3Es%3C/text%3E%3Ccircle cx='25' cy='25' r='3' fill='%23844b36'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --paper: #f6f5f1; --ink: #252925; --muted: #666960; --line: #d5d7ce; --accent: #844b36; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 7px; }
    .page { min-height: 100svh; max-width: 1600px; margin: auto; padding: 40px 64px 28px; display: flex; flex-direction: column; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 26px; border-bottom: 1px solid var(--line); font-size: .875rem; }
    .wordmark { font-weight: 700; letter-spacing: -.04em; font-size: 1.125rem; }
    .caption { color: var(--muted); }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 220px; align-items: center; gap: 48px; padding: 80px 0; }
    .eyebrow { margin: 0 0 26px; font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 0 0 30px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(4rem, 9.8vw, 10rem); font-weight: 400; line-height: 1.06; letter-spacing: -.065em; }
    h1 span { color: var(--accent); }
    .intro { margin: 0; max-width: 410px; font-size: clamp(1.25rem, 2vw, 1.6rem); line-height: 1.5; letter-spacing: -.025em; }
    .connect { margin-top: 44px; display: inline-flex; align-items: center; gap: 32px; min-height: 48px; padding: 13px 0; border-bottom: 1px solid var(--ink); text-decoration: none; font-size: 1rem; transition: color .2s, gap .2s; }
    .connect:hover { color: var(--accent); gap: 42px; }
    .connect svg { width: 22px; height: 22px; }
    .print { margin: 0; aspect-ratio: 3 / 4; display: flex; flex-direction: column; justify-content: space-between; padding: 21px; background: #e9ebe3; transform: rotate(5deg); border: 1px solid #d8dcd0; }
    .print-top { font-size: .875rem; display: flex; justify-content: space-between; }
    .monogram { font-family: Georgia, 'Times New Roman', serif; font-size: 10rem; font-weight: 400; line-height: .9; letter-spacing: -.08em; align-self: center; }
    .monogram span { color: var(--accent); }
    .print-bottom { font-size: .875rem; color: #565d50; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid var(--line); padding-top: 24px; font-size: .875rem; color: var(--muted); }
    footer a { text-decoration: none; padding: 8px 0; }
    footer a:hover { color: var(--accent); }
    @media (min-width: 1800px) { .page { min-height: min(100svh, 1200px); } }
    @media (max-width: 900px) { .page { padding: 28px 32px 24px; } main { grid-template-columns: minmax(0, 1fr) 160px; gap: 24px; } .print { padding: 16px; } .monogram { font-size: 7rem; } h1 { font-size: clamp(4rem, 10vw, 7rem); } }
    @media (max-width: 600px) { .page { padding: 24px; } .masthead { padding-bottom: 20px; } main { grid-template-columns: minmax(0, 1fr); padding: 64px 0; gap: 56px; } h1 { font-size: clamp(3.6rem, 14vw, 5.5rem); margin-bottom: 24px; } .intro { font-size: 1.25rem; max-width: 280px; } .connect { margin-top: 28px; } .print { width: 150px; justify-self: end; margin-right: 8px; } footer { flex-wrap: wrap; gap: 8px 24px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead"><span class="wordmark">itsSivvis</span><span class="caption">Digitale Visitenkarte</span></header>
    <main>
      <section aria-labelledby="name">
        <p class="eyebrow">Hallo, ich bin</p>
        <h1 id="name">itsSivvis<span>.</span></h1>
        <p class="intro">Ein guter Anfang<br>ist ein Hallo.</p>
        <a class="connect" href="https://github.com/itsSivvis">Auf GitHub verbinden<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a>
      </section>
      <div class="print" aria-hidden="true"><div class="print-top"><span>itsSivvis</span><span>↗</span></div><div class="monogram">s<span>.</span></div><div class="print-bottom">Einfach in Verbindung bleiben.</div></div>
    </main>
    <footer><span>Wenige Worte. Ein direkter Kontakt.</span><a href="https://github.com/itsSivvis">@itsSivvis ↗</a></footer>
  </div>
</body>
</html>
